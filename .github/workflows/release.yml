name: Release

# A tag builds the package on MODX 2, installs that zip on MODX 2 and MODX 3,
# and only then publishes the GitHub release. A manual run builds and checks
# the package and keeps the zip as an artifact.

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: The tag names the version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: php _build/ci/version.php "$TAG"

  package:
    needs: version
    uses: ./.github/workflows/package.yml

  integration:
    needs: package
    uses: ./.github/workflows/integration.yml

  publish:
    name: Publish
    needs: [package, integration]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: _packages

      - name: Write the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          version="${version%-pl}"
          awk -v heading="## [$version-pl]" '
            index($0, heading) == 1 { show = 1 }
            show && seen && index($0, "## [") == 1 { exit }
            show { print; seen = 1 }
          ' core/components/mobiledetect/docs/changelog.txt > _packages/notes.md
          grep -q '[^[:space:]]' _packages/notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNATURE: ${{ needs.package.outputs.signature }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file _packages/notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file _packages/notes.md
          fi
          gh release upload "$TAG" "_packages/${SIGNATURE}.transport.zip" --clobber
